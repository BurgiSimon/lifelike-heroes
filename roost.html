<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Roost hero — Evensong, Evensong</title>
  <style>
    /* The scene's still: what the gallery closed on, and what the page shows until the scene itself is drawn. */
    .poster { background-image: url('/assets/gallery/roost-wide.jpg'); }
    @media (orientation: portrait) { .poster { background-image: url('/assets/gallery/roost-tall.jpg'); } }
  </style>
</head>
<body>
  <main id="hero" class="hero"></main>
  <div class="poster" aria-hidden="true"></div>
  <script type="module">
    import '/src/shared/base.css';
    import mount, { controls, actions } from '/src/roost/index.js';
    import { chrome } from '/src/shared/chrome.js';
    import { soundPref } from '/src/shared/sound.js';
    window.hero = mount(document.getElementById('hero'), { sound: soundPref.get() });   // as the visitor left it, here or on the gallery
    chrome(window.hero, { controls, actions });
  </script>
</body>
</html>
